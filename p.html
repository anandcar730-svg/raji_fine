<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dorcas Institute</title>

<style>
:root{
  --pink:#ff3399;
  --lav:#cc66ff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#fff5f8;}

/* HEADER */
header{
  position:fixed;
  width:100%;
  top:0;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  z-index:1000;
}

header img{height:50px;}

nav{
  display:flex;
  gap:15px;
}

nav a{
  text-decoration:none;
  color:#333;
  font-weight:600;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('./back.jpeg');
  background-size:cover;
  color:white;
  padding:0 20px;
}

.title-img{
  width:320px;
  max-width:90%;
  margin-bottom:15px;
}

.hero p{font-size:18px;margin-bottom:15px;}

.btn{
  background:linear-gradient(45deg,var(--pink),var(--lav));
  padding:12px 25px;
  border-radius:30px;
  color:white;
  text-decoration:none;
  display:inline-block;
}

/* SECTIONS */
.section{
  padding:80px 15px;
  text-align:center;
}

.section h2{margin-bottom:25px;font-size:28px;}

/* CARDS */
.card-container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  width:260px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
  align-items:center;
}

form input,form select{
  width:90%;
  max-width:350px;
  padding:12px;
  margin:8px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
  padding:10px;
}

.gallery img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
}

/* FOOTER */
footer{
  background:#111;
  color:white;
  text-align:center;
  padding:15px;
}

/* MOBILE NAV */
.menu-btn{
  display:none;
  font-size:24px;
  cursor:pointer;
}

@media(max-width:768px){
  nav{
    display:none;
    position:absolute;
    top:60px;
    right:0;
    background:white;
    flex-direction:column;
    width:200px;
    padding:10px;
  }

  nav.active{display:flex;}

  .menu-btn{display:block;}
}

</style>
</head>
<body>

<header>
<img src="./logo.png">
<div class="menu-btn" onclick="toggleMenu()">☰</div>
<nav id="nav">
<a href="index.html">Home</a>
<a href="courses.html">Courses</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<section class="hero">
<img src="./name.png" class="title-img">
<p>Institute of Fashion Designing</p>
<a href="#enroll" class="btn">Apply Now</a>
</section>

<section class="section">
<h2>Courses</h2>
<div class="card-container">
<div class="card">
<h3>3 Month</h3>
<p>Certification</p>
</div>
<div class="card">
<h3>6 Month</h3>
<p>Diploma</p>
</div>
</div>
</section>

<section class="section">
<h2>About Institute</h2>
<p>Professional fashion designing training with practical exposure and creative learning.</p>
</section>

<section class="section" id="enroll">
<h2>Enroll Now</h2>
<form>
<input type="text" placeholder="Your Name" required>
<input type="tel" placeholder="Phone Number" required>
<select>
<option>3 Month Course</option>
<option>6 Month Course</option>
</select>
<button class="btn">Proceed to Payment</button>
</form>
</section>

<section class="section">
<h2>Gallery</h2>
<div class="gallery">
<img src="./img1.jpeg">
<img src="./img2.jpeg">
<img src="./img3.jpeg">
<img src="./img4.jpeg">
<img src="./img5.jpeg">
<img src="./img6.jpeg">
<img src="./img7.jpeg">
<img src="./img8.jpeg">
<img src="./img9.jpeg">
</div>
</section>

<footer>
<p>© Dorcas Institute</p>
</footer>

<script>
function toggleMenu(){
  document.getElementById('nav').classList.toggle('active');
}
</script>

</body>
</html>
